[project]
name = "dynamic-power-monitor-backend"
version = "0.1.0"
description = "Async TCP ingest + FastAPI WebSocket/HTTP backend for the 12V power monitor."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[project.scripts]
power-monitor = "power_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["power_monitor"]
